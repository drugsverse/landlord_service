[package]
name = "landlord_service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.1"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
rdkafka = { version = "0.39.0", features = ["zstd", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
